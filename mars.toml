[dependencies.meridian-dev-workflow]
url = "https://github.com/haowjy/meridian-dev-workflow"

[dependencies.creative-writing-skills]
url = "https://github.com/haowjy/creative-writing-skills"

[dependencies.meridian-prompter]
url = "https://github.com/haowjy/meridian-prompter"

[settings]
targets = [
    ".opencode",
    ".pi",
    ".claude",
    ".codex",
]
models_cache_ttl_hours = 24

[settings.meridian.agent_copy]
harnesses = ["claude"]
include_fanout = false

[settings.meridian.fanout]
agents = [
    "reviewer",
#     "prober",
    "coder",
    "subagent",
]
