packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/mf'
verifyDepsBeforeRun: false
allowBuilds:
  nx: true
  esbuild: false
  lefthook: false
  protobufjs: false

catalog:
  '@meridian-flow/runtime': ^0.2.0
  '@types/node': ^26
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.3
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  nitro: 3.0.260610-beta
  postgres: 4.0.0
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^6.0.3
  vite: ^8.1.0
  vitest: ^4.1.9

# First-party packages are ours: take a release before the age cutoff passes.
minimumReleaseAgeExclude:
  - '@meridian-flow/*'

# Use the upstream traversal-delta fix plus the scoped stale-POP/go(0) patch below.
overrides:
  "@tanstack/history": 1.162.5
patchedDependencies:
  '@hocuspocus/provider@4.8.0': patches/@hocuspocus__provider@4.8.0.patch
  '@tanstack/history@1.162.5': patches/@tanstack__history@1.162.5.patch
  '@tiptap/core@3.34.0': patches/@tiptap__core@3.34.0.patch
  '@tiptap/y-tiptap@3.3.0': patches/@tiptap__y-tiptap@3.3.0.patch
  'decode-named-character-reference@1.3.0': patches/decode-named-character-reference@1.3.0.patch
  micromark@4.0.3: patches/micromark@4.0.3.patch
  prosemirror-view@1.42.9: patches/prosemirror-view@1.42.9.patch
  yjs@13.6.33: patches/yjs@13.6.33.patch
