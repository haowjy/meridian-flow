<!--
  How Meridian Flow is built today, as diagrams you can click into. The map's content is
  architecture.js; js/ renders it. No build step: open this file from disk, or run `pnpm dev`
  and open the printed architecture URL (state machine pages need it: they are fetched from the
  repo). Edit the map, then run `pnpm check:architecture`.

  Every third-party script is pinned here and nowhere else (Mermaid, which loads when the first
  state machines page opens, is pinned in js/doc-view.js), with its integrity hash.
  React stays on 18 because 19 ships no UMD build; @xyflow/react's UMD build needs React and
  ReactDOM as globals, and js/jsx-runtime.js gives it the jsx runtime it expects.
-->
