-->

    <p>A browser won't read the map's pages from disk (file://).</p>
    <p>Run <code>pnpm dev</code> and open the printed <code>map</code> URL.</p>
  </div>
</div>
<script>
  if (location.protocol !== "file:") document.getElementById("root").textContent = "Loading…";
</script>
