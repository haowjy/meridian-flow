# Checks the branch's open PR body against .github/PULL_REQUEST_TEMPLATE.md.
# `pnpm check:pr-body` runs the same check locally as the last step of `pnpm check`;
# this workflow is for running it from a clean checkout.
name: PR body

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-lint:
    name: pr-body-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs the branch against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - name: Check body against the template
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/check-pr-body.mjs --strict
