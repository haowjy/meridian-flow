name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing built version to redeploy, without leading v
        required: true
        type: string

jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release: v')
    # GitHub retains one pending group run; newest release wins and only staged commits are promotable.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Resolve release tag and version
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$RELEASE_SHA"
          mapfile -t tags < <(git tag --points-at "$sha" 'v*')
          [[ ${#tags[@]} -eq 1 ]] || { echo "::error::Expected exactly one v* tag on $sha; found ${#tags[@]}: ${tags[*]}"; exit 1; }
          tag=${tags[0]}
          version=${tag#v}
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" == "$version" ]] || { echo "::error::Tag $tag does not match root package.json version $package_version"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::Invalid release version $version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/haowjy/meridian-flow-server:v${{ steps.release.outputs.version }}
            ghcr.io/haowjy/meridian-flow-server:sha-${{ steps.release.outputs.sha }}
          build-args: |
            MERIDIAN_VERSION=${{ steps.release.outputs.version }}
            MERIDIAN_RELEASE_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=meridian-server
          cache-to: type=gha,mode=max,scope=meridian-server
      - name: Build app image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: |
            ghcr.io/haowjy/meridian-flow-app:v${{ steps.release.outputs.version }}
            ghcr.io/haowjy/meridian-flow-app:sha-${{ steps.release.outputs.sha }}
          build-args: |
            MERIDIAN_VERSION=${{ steps.release.outputs.version }}
            MERIDIAN_RELEASE_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=meridian-app
          cache-to: type=gha,mode=max,scope=meridian-app
      - name: Build www image
        id: www
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/www/Dockerfile
          push: true
          tags: |
            ghcr.io/haowjy/meridian-flow-www:v${{ steps.release.outputs.version }}
            ghcr.io/haowjy/meridian-flow-www:sha-${{ steps.release.outputs.sha }}
          build-args: |
            MERIDIAN_VERSION=${{ steps.release.outputs.version }}
            MERIDIAN_RELEASE_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=meridian-www
          cache-to: type=gha,mode=max,scope=meridian-www
      - name: Build ingress image
        id: ingress
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/deploy/ingress/Dockerfile
          push: true
          tags: |
            ghcr.io/haowjy/meridian-flow-ingress:v${{ steps.release.outputs.version }}
            ghcr.io/haowjy/meridian-flow-ingress:sha-${{ steps.release.outputs.sha }}
          build-args: |
            MERIDIAN_VERSION=${{ steps.release.outputs.version }}
            MERIDIAN_RELEASE_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=meridian-ingress
          cache-to: type=gha,mode=max,scope=meridian-ingress
      - name: Create manifest and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WWW_DIGEST: ${{ steps.www.outputs.digest }}
          INGRESS_DIGEST: ${{ steps.ingress.outputs.digest }}
        run: |
          export repository=ghcr.io/haowjy/meridian-flow
          node - <<'NODE' > release-manifest.json
          const env = process.env;
          const image = (service) => ({repository: `${env.repository}-${service}`, digest: env[`${service.toUpperCase()}_DIGEST`], ref: `${env.repository}-${service}@${env[`${service.toUpperCase()}_DIGEST`]}`});
          console.log(JSON.stringify({version: env.VERSION, tag: env.TAG, sha: env.SHA, images: {server:image('server'),app:image('app'),www:image('www'),ingress:image('ingress')},builtAt:new Date().toISOString(),runUrl:`${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`}, null, 2));
          NODE
          if [[ "$VERSION" == *-rc.* ]]; then heading='## [Unreleased]'; else heading="## [$VERSION]"; fi
          section=$(awk -v heading="$heading" 'index($0, heading)==1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md || true)
          printf '%s\n' "$section" > release-notes.md
          flags=(); [[ "$VERSION" == *-rc.* ]] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
            gh release upload "$TAG" release-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-manifest.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi

  deploy-built:
    needs: build
    if: always() && needs.build.result == 'success'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}
    secrets: inherit

  deploy-existing:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate existing release
        id: validate
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::Enter an existing version without leading v, such as 1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
  deploy-existing-call:
    needs: deploy-existing
    if: github.event_name == 'workflow_dispatch' && needs.deploy-existing.result == 'success'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      version: ${{ needs.deploy-existing.outputs.version }}
    secrets: inherit
