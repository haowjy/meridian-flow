name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Resolve release tag and version
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$RELEASE_SHA"
          mapfile -t tags < <(git tag --points-at "$sha" 'v*')
          [[ ${#tags[@]} -eq 1 ]] || { echo "::error::Expected exactly one v* tag on $sha; found ${#tags[@]}: ${tags[*]}"; exit 1; }
          tag=${tags[0]}
          version=${tag#v}
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" == "$version" ]] || { echo "::error::Tag $tag does not match root package.json version $package_version"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::Invalid release version $version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Reuse existing release manifest when available
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | index("release-manifest.json") != null' | grep -qx true; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP/existing"
            node tools/deploy/manifest.ts validate "$RUNNER_TEMP/existing/release-manifest.json" "$TAG" "$RELEASE_SHA"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists != 'true'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.existing.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release images
        id: images
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for service in server app www ingress; do
            case "$service" in
              server|app|www) dockerfile="apps/$service/Dockerfile" ;;
              ingress) dockerfile=tools/deploy/ingress/Dockerfile ;;
            esac
            image="ghcr.io/haowjy/meridian-flow-$service"
            metadata="$RUNNER_TEMP/$service-metadata.json"
            docker buildx build --push --metadata-file "$metadata" \
              --file "$dockerfile" --tag "$image:v$VERSION" \
              --tag "$image:sha-$RELEASE_SHA" \
              --build-arg "MERIDIAN_VERSION=$VERSION" \
              --build-arg "MERIDIAN_RELEASE_SHA=$RELEASE_SHA" \
              --cache-from "type=gha,scope=meridian-$service" \
              --cache-to "type=gha,mode=max,scope=meridian-$service" .
            digest=$(jq -er '.["containerimage.digest"]' "$metadata")
            echo "$service=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Create manifest and release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
          SERVER_DIGEST: ${{ steps.images.outputs.server }}
          APP_DIGEST: ${{ steps.images.outputs.app }}
          WWW_DIGEST: ${{ steps.images.outputs.www }}
          INGRESS_DIGEST: ${{ steps.images.outputs.ingress }}
        run: |
          node tools/deploy/manifest.ts create release-manifest.json
          node tools/deploy/manifest.ts validate release-manifest.json "$TAG" "$SHA"
          if [[ "$VERSION" == *-rc.* ]]; then heading='## [Unreleased]'; else heading="## [$VERSION]"; fi
          section=$(awk -v heading="$heading" 'index($0, heading)==1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md || true)
          printf '%s\n' "$section" > release-notes.md
          flags=(); [[ "$VERSION" == *-rc.* ]] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
            gh release upload "$TAG" release-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-manifest.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi
      - name: Prepare existing manifest for deployment
        if: steps.existing.outputs.exists == 'true'
        run: cp "$RUNNER_TEMP/existing/release-manifest.json" "$RUNNER_TEMP/release-manifest.json"
      - name: Prepare built manifest for deployment
        if: steps.existing.outputs.exists != 'true'
        run: cp release-manifest.json "$RUNNER_TEMP/release-manifest.json"

  deploy-built:
    needs: build
    if: always() && needs.build.result == 'success'
    # One pending run per group means a burst can replace an older waiting deploy; staging converges to newest.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
