name: CI

on:
  # Any non-draft PR gets verified, regardless of base branch. `on:` can't
  # filter by draft state, so the draft gate lives on the jobs below.
  # `ready_for_review` is included so marking a draft ready triggers a run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Push CI on main verifies the post-merge result. Staging invokes this workflow
  # from Deploy Staging, so listing it here would run the full workflow twice.
  push:
    branches: [main]
  workflow_call:

# Supersede in-flight runs for the same ref so rapid re-pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job sets timeout-minutes (several times its usual run) so a hang fails the PR instead of
  # holding it for GitHub's six-hour default.
  # scripts.check remains the inventory; keep explicit jobs so the required
  # aggregate checks each result directly, including after partial reruns.
  quality-static:
    name: quality-static
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/run-check-group.mjs static

  quality-typecheck:
    name: quality-typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep Nx outputs local to this runner; do not restore them across CI runs.
      - run: node tools/ci/run-check-group.mjs typecheck

  # Vitest partitions the same default projects into disjoint file sets.
  quality-test-1:
    name: quality-test-1
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # S7 reads the pre-history snapshot when bootstrapping its immutable
          # collaboration schema history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/run-check-group.mjs test --shard=1/2

  quality-test-2:
    name: quality-test-2
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # S7 reads the pre-history snapshot when bootstrapping its immutable
          # collaboration schema history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/run-check-group.mjs test --shard=2/2

  quality:
    name: quality
    needs: [quality-static, quality-typecheck, quality-test-1, quality-test-2]
    # A skipped required job counts as passing. Run even after a dependency
    # fails/cancels/skips, but retain the workflow's deliberate draft-PR skip.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality group to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'

  migration-checks:
    name: migration-checks
    # Skip draft PRs; every non-PR caller runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `drizzle-kit check` validates the snapshot chain offline and never
      # connects, but the shared drizzle.config.ts requires DATABASE_URL to be
      # set. A placeholder satisfies that without provisioning a database.
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meridian/database exec drizzle-kit check
      - name: Check generated baseline
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/src/migrations

  db-tests:
    name: db-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Pinned: Postgres comes preinstalled with the runner image (16 on 24.04), so
    # the major version changes only when this label does. `ubuntu-latest` moves
    # to a newer Ubuntu that ships a different major.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meridian_test_ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # The runner's own server: nothing to download, so no registry rate limit.
      # Dev and release run tools/postgres/Dockerfile (postgres:16 + pg_bigm). PGDG has no
      # pg_bigm package, so build the same pinned version against the runner's server.
      - name: Install pg_bigm
        run: |
          install() {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-server-dev-16 libicu-dev
          }
          # ubuntu.com names (the image's Azure mirror and archive.ubuntu.com) sometimes stop resolving on
          # the runners for hours; kernel.org carries the same archive.
          install || {
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            install
          }
          SUDO=sudo tools/postgres/install-pg-bigm.sh
      - name: Start Postgres
        run: |
          echo "shared_preload_libraries = 'pg_bigm'" | sudo tee /etc/postgresql/16/main/conf.d/pg_bigm.conf
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'"
          psql -h 127.0.0.1 -U postgres -tAc "SELECT version()"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create throwaway database
        run: createdb -h 127.0.0.1 -U postgres meridian_test_ci
      - name: Prove baseline from empty
        run: pnpm db:migrate
      - name: Prove search extensions install
        run: pnpm db:check-extensions
      - name: Run required DB suites
        run: pnpm test:db
      # Self-contained probes (tools/qa/probes/*/run.mts): they make and drop their own database.
      - name: Run database probes
        run: pnpm test:probes

  app-dev-transform:
    name: app-dev-transform
    # Skip draft PRs; pushes and workflow_call always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Boots the app dev server and asserts the exact public route contract —
      # catches transform/wiring-class runtime breaks `pnpm check` misses.
      # No DB or WorkOS secrets needed: the smoke supplies dev-boot placeholders
      # and never authenticates (see tools/dev/smoke-app-dev-transform.ts).
      - run: pnpm smoke:app-dev-transform

  prod-boot:
    name: prod-boot
    # Skip draft PRs; pushes and workflow_call always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds .output, passes structurally valid fake production config through
      # the child environment, then boots and probes the generated Nitro server.
      - run: pnpm smoke:prod-boot
