name: Release on merge

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    concurrency:
      group: release-on-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Resolve all unreleased first-parent merges
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: tools/release/resolve-batch.sh
      - name: Publish versioned release
        env:
          TRIGGER_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BATCH_JSON: ${{ steps.batch.outputs.batch }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: tools/release/publish.sh
